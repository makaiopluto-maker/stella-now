name: Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - run: npm ci

      # Capacitor serves `out/` at the app origin root — never bake GitHub Pages basePath into the APK.
      - run: npm run build

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/stella-now.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep a stable download URL for the website button.
          STABLE_TAG="apk-latest"
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            gh release upload "$STABLE_TAG" dist/stella-now.apk --clobber
          else
            gh release create "$STABLE_TAG" dist/stella-now.apk \
              --title "Stella Now Android" \
              --notes "Unofficial Stella Now Android APK."
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$STABLE_TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/stella-now.apk --clobber
            else
              gh release create "$TAG" dist/stella-now.apk \
                --title "Stella Now Android ${TAG}" \
                --notes "Unofficial Stella Now Android APK (${TAG})."
            fi
          fi
