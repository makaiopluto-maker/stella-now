name: Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - run: npm ci

      # Capacitor serves `out/` at the app origin root — never bake GitHub Pages basePath into the APK.
      - run: npm run build

      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/StellaNow.apk
          VERSION="$(node -p "require('./package.json').version")"
          printf '%s\n' "{
            \"version\": \"$VERSION\",
            \"apk\": \"https://github.com/makaiopluto-maker/stella-now/releases/download/apk-latest/StellaNow.apk\",
            \"releases\": \"https://github.com/makaiopluto-maker/stella-now/releases/tag/apk-latest\"
          }" > dist/app-version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep a stable download URL for the website button + in-app update check.
          STABLE_TAG="apk-latest"
          VERSION="$(node -p "require('./package.json').version")"
          APK="dist/StellaNow.apk"

          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            # Drop the legacy asset name so downloads always use StellaNow.apk.
            gh release delete-asset "$STABLE_TAG" stella-now.apk --yes 2>/dev/null || true
            gh release upload "$STABLE_TAG" "$APK" dist/app-version.json --clobber
            gh release edit "$STABLE_TAG" --title "StellaNow Android $VERSION" --notes "Unofficial StellaNow Android APK ($VERSION)."
          else
            gh release create "$STABLE_TAG" "$APK" dist/app-version.json \
              --title "StellaNow Android $VERSION" \
              --notes "Unofficial StellaNow Android APK ($VERSION)."
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$STABLE_TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" dist/app-version.json --clobber
            else
              gh release create "$TAG" "$APK" dist/app-version.json \
                --title "StellaNow Android ${TAG}" \
                --notes "Unofficial StellaNow Android APK (${TAG})."
            fi
          fi
